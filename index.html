<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For Atena ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 15%,#2a0e3f 0%,#180826 45%,#0a0413 100%);
    font-family:'Vazirmatn',sans-serif;
    color:#ffd7e8;
  }

  /* ---------- stars ---------- */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{
    position:absolute;border-radius:50%;background:#fff;
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.8)}
    50%{opacity:1;transform:scale(1.15)}
  }

  /* ---------- floating hearts ---------- */
  #floaters{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .floater{
    position:absolute;bottom:-40px;opacity:0;
    animation:rise linear infinite;
    filter:drop-shadow(0 0 6px #ff5fa0aa);
  }
  .floater-text{
    font-weight:600;white-space:nowrap;letter-spacing:.3px;
    text-shadow:0 0 5px currentColor,0 0 10px #ff2f7c70;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0}
    8%{opacity:.85}
    50%{transform:translateY(-52vh) translateX(var(--drift)) rotate(var(--spin))}
    92%{opacity:.6}
    100%{transform:translateY(-105vh) translateX(calc(var(--drift) * -1)) rotate(0deg);opacity:0}
  }

  /* ---------- intro ---------- */
  #intro{
    position:fixed;inset:0;z-index:30;
    background:radial-gradient(120% 90% at 50% 20%,#2a0e3f 0%,#150723 55%,#08030f 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 32px;
    transition:opacity .9s ease,visibility .9s ease;
  }
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  #intro .name{
    font-family:'Dancing Script',cursive;font-weight:700;
    font-size:64px;color:#ffb0d3;margin:0 0 6px;
    text-shadow:0 0 18px #ff4f9a,0 0 46px #ff2f7c80;
  }
  #intro p{
    font-size:15px;font-weight:300;color:#e7c9dc;margin:0 0 30px;
    max-width:280px;line-height:2;
  }
  #intro button{
    border:none;cursor:pointer;
    background:linear-gradient(135deg,#ff5fa0,#ff2f7c);
    color:#fff;font-family:'Vazirmatn';font-weight:600;
    border-radius:999px;padding:14px 34px;font-size:15px;letter-spacing:.5px;
    box-shadow:0 8px 28px #ff2f7c55,0 0 0 1px #ff9dc340 inset;
  }

  /* ---------- scene ---------- */
  .scene{
    position:relative;z-index:2;
    width:100vw;height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;
  }

  /* a cluster of many small & big hearts, pink + red, instead of one big heart */
  .heart-cluster{
    position:relative;z-index:2;
    width:min(84vw,360px);height:min(78vw,330px);
    cursor:pointer;
    opacity:0;
    animation:clusterIn 1.1s cubic-bezier(.17,.9,.32,1.28) forwards;
  }
  .mini-heart{
    position:absolute;left:0;top:0;
    transform:translate(-50%,-50%);
    animation:miniBeat ease-in-out infinite;
  }
  .mini-heart svg{display:block;width:100%;height:auto}
  @keyframes clusterIn{
    0%{opacity:0;transform:scale(.3) rotate(-6deg)}
    60%{opacity:1;transform:scale(1.07) rotate(2deg)}
    100%{opacity:1;transform:scale(1) rotate(0deg)}
  }
  @keyframes miniBeat{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    30%{transform:translate(-50%,-50%) scale(1.16)}
    55%{transform:translate(-50%,-50%) scale(.94)}
    75%{transform:translate(-50%,-50%) scale(1.08)}
  }

  .signature{
    font-family:'Dancing Script',cursive;font-weight:700;
    font-size:46px;color:#ffc3dc;
    text-shadow:0 0 16px #ff4f9a;
    margin-top:2px;
    opacity:0;
    animation:fadeUp 1s ease .9s forwards;
  }
  .hint{
    font-size:12px;color:#c9a6bd;letter-spacing:2px;opacity:0;
    animation:fadeUp 1s ease 1.3s forwards;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }

  .message{
    position:absolute;left:50%;bottom:8%;
    transform:translate(-50%,14px);
    width:min(86vw,360px);
    text-align:center;font-size:14.5px;line-height:2.3;color:#ffe1ee;
    background:rgba(30,8,26,.55);backdrop-filter:blur(6px);
    border:1px solid #ff8fbf33;border-radius:18px;
    padding:20px 22px;
    opacity:0;pointer-events:none;
    transition:opacity .6s ease,transform .6s ease;
  }
  .message.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .message .cursor{opacity:.8;animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:0}}

  /* burst particles */
  .burst{position:fixed;z-index:5;pointer-events:none;left:0;top:0}
</style>
</head>
<body>

<div id="stars"></div>
<div id="floaters"></div>

<div id="intro">
  <div class="name">Atena</div>
  <p>یه چیز کوچیک فقط برای تو ساختم...<br>رو قلب بزن</p>
  <button onclick="start()">بازش کن</button>
</div>

<div class="scene">
  <div class="heart-cluster" id="heart" onclick="tap(event)"></div>
  <div class="signature">Atena</div>
  <div class="hint">برای دیدن پیام، رو قلب‌ها بزن</div>
</div>

<div class="message" id="msg"></div>

<script>
/* ---------- stars ---------- */
const starsEl = document.getElementById('stars');
for(let i=0;i<70;i++){
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random()*2 + 1;
  s.style.width = size+'px';
  s.style.height = size+'px';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*70+'%';
  s.style.animationDuration = (Math.random()*3+2)+'s';
  s.style.animationDelay = (Math.random()*3)+'s';
  starsEl.appendChild(s);
}

/* ---------- floating hearts ---------- */
const HEART_PATH = 'M16 28.5 C16 28.5 1 18.7 1 9.9 C1 4.6 5.1 1 9.6 1 C12.6 1 15 2.9 16 5.4 C17 2.9 19.4 1 22.4 1 C26.9 1 31 4.6 31 9.9 C31 18.7 16 28.5 16 28.5 Z';
function makeHeartSVG(color){
  return `<svg viewBox="0 0 32 29" width="100%" height="100%"><path fill="${color}" d="${HEART_PATH}"/></svg>`;
}
const floaters = document.getElementById('floaters');
const palette = ['#ff8fbf','#ff5fa0','#ffb3d1','#ff2f7c'];
for(let i=0;i<16;i++){
  const f = document.createElement('div');
  f.className='floater';
  const size = Math.random()*14+8;
  f.style.width = size+'px';
  f.style.height = size+'px';
  f.style.left = Math.random()*100+'%';
  f.style.setProperty('--drift',(Math.random()*60-30)+'px');
  f.style.setProperty('--spin',(Math.random()*40-20)+'deg');
  f.style.animationDuration = (Math.random()*6+7)+'s';
  f.style.animationDelay = (Math.random()*8)+'s';
  f.innerHTML = makeHeartSVG(palette[i%palette.length]);
  floaters.appendChild(f);
}

/* small floating "I love you" text pieces, scattered and drifting up */
const TEXT_COUNT = 22;
for(let i=0;i<TEXT_COUNT;i++){
  const t = document.createElement('div');
  t.className = 'floater floater-text';
  const size = 9 + Math.random()*4; // small, 9-13px
  t.style.fontSize = size+'px';
  t.style.color = palette[i%palette.length];
  t.style.left = Math.random()*100+'%';
  t.style.setProperty('--drift',(Math.random()*70-35)+'px');
  t.style.setProperty('--spin',(Math.random()*24-12)+'deg');
  t.style.animationDuration = (Math.random()*8+9)+'s';
  t.style.animationDelay = (Math.random()*11)+'s';
  t.textContent = 'I love you';
  floaters.appendChild(t);
}

/* ---------- cluster of many small & big hearts, arranged in a heart silhouette ---------- */
const clusterEl = document.getElementById('heart');
const CW = 320, CH = 300;           // internal coordinate box for the cluster
const cx = 160, cy = 150, hscale = 9.6;

function heartPoint(t,s){
  const x = 16*Math.pow(Math.sin(t),3);
  const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return {x:cx+x*s, y:cy-y*s};
}
// approximate centroid so we can sample the interior (heart is ~star-shaped from here)
let sx=0, sy=0, N=360;
for(let i=0;i<N;i++){
  const p = heartPoint((i/N)*Math.PI*2, hscale);
  sx+=p.x; sy+=p.y;
}
const anchor = {x:sx/N, y:sy/N};

const reds  = ['#ff2f4f','#ff1f3d','#e6135f','#ff3f5c'];
const pinks = ['#ff8fbf','#ff5fa0','#ffb3d1','#ff6fac'];

const COUNT = 42;
for(let i=0;i<COUNT;i++){
  const t = Math.random()*Math.PI*2;
  const s = 0.18 + Math.random()*1.15; // looser, more scattered — some drift past the outline
  const b = heartPoint(t, hscale);
  const jitterX = (Math.random()-0.5)*26;
  const jitterY = (Math.random()-0.5)*26;
  const px = anchor.x + s*(b.x-anchor.x) + jitterX;
  const py = anchor.y + s*(b.y-anchor.y) + jitterY;

  // size mix: mostly small, some medium, a few big
  const r = Math.random();
  let size;
  if(r<0.55) size = 10 + Math.random()*12;      // small
  else if(r<0.87) size = 22 + Math.random()*16; // medium
  else size = 40 + Math.random()*26;             // big

  const color = Math.random()<0.5 ? pinks[i%pinks.length] : reds[i%reds.length];

  const el = document.createElement('div');
  el.className = 'mini-heart';
  el.style.width = size+'px';
  el.style.left = (px/CW*100)+'%';
  el.style.top = (py/CH*100)+'%';
  el.style.filter = `drop-shadow(0 0 ${Math.max(4,size*0.25)}px ${color}99)`;
  el.style.animationDuration = (1.6+Math.random()*1.6)+'s';
  el.style.animationDelay = (-Math.random()*3)+'s';
  el.style.zIndex = Math.round(size);
  el.innerHTML = `<svg viewBox="0 0 32 29"><path fill="${color}" d="M16 28.5 C16 28.5 1 18.7 1 9.9 C1 4.6 5.1 1 9.6 1 C12.6 1 15 2.9 16 5.4 C17 2.9 19.4 1 22.4 1 C26.9 1 31 4.6 31 9.9 C31 18.7 16 28.5 16 28.5 Z"/></svg>`;
  clusterEl.appendChild(el);
}

/* ---------- intro ---------- */
function start(){
  document.getElementById('intro').classList.add('hide');
  if(navigator.vibrate) navigator.vibrate([25,35,25]);
}

/* ---------- tap heart: burst + typewriter message ---------- */
const FULL_MESSAGE = 'ببخشید دختر قشنگم، خیلی عاشقتم. امیدوارم با دیدن این، لبخند بیاد رو لبات؛ چون برای خوشحالیت هرکاری می‌کنم 🫂❤️';
let revealed = false;
function tap(e){
  spawnBurst(e.clientX, e.clientY);
  if(navigator.vibrate) navigator.vibrate(30);
  if(!revealed){
    revealed = true;
    typeMessage();
  }
}
function typeMessage(){
  const msgEl = document.getElementById('msg');
  msgEl.classList.add('show');
  msgEl.innerHTML = '<span id="typed"></span><span class="cursor">|</span>';
  const typed = document.getElementById('typed');
  let i = 0;
  const timer = setInterval(()=>{
    typed.textContent += FULL_MESSAGE[i];
    i++;
    if(i>=FULL_MESSAGE.length){
      clearInterval(timer);
      document.querySelector('.cursor').style.display='none';
    }
  },42);
}
function spawnBurst(x,y){
  for(let i=0;i<10;i++){
    const p = document.createElement('div');
    p.className='burst';
    const size = Math.random()*10+6;
    p.style.width=size+'px';
    p.style.height=size+'px';
    p.innerHTML = makeHeartSVG(palette[i%palette.length]);
    p.style.left = x+'px';
    p.style.top = y+'px';
    document.body.appendChild(p);
    const ang = Math.random()*Math.PI*2;
    const dist = Math.random()*70+40;
    const dx = Math.cos(ang)*dist;
    const dy = Math.sin(ang)*dist;
    p.animate([
      {transform:'translate(-50%,-50%) translate(0,0) scale(1)',opacity:1},
      {transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.3)`,opacity:0}
    ],{duration:700+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}
</script>
</body>
</html>
